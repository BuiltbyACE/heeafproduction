<svg width="1600" height="265" viewBox="0 0 1600 265" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a63a"/>
      <stop offset="45%" stop-color="#e8a03a"/>
      <stop offset="75%" stop-color="#d98b2b"/>
      <stop offset="100%" stop-color="#b96a1e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3d18"/>
      <stop offset="100%" stop-color="#3a2610"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="60%" stop-color="#f6c96a"/>
      <stop offset="100%" stop-color="#f4a63a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="265" fill="url(#sky)"/>

  <!-- Sunset glow -->
  <circle cx="1180" cy="95" r="120" fill="url(#sun)"/>
  <circle cx="1180" cy="95" r="38" fill="#fff3c4"/>

  <!-- Distant refinery on the left -->
  <g opacity="0.9">
    <rect x="40" y="120" width="300" height="145" fill="#5a3d18"/>
    <rect x="40" y="120" width="300" height="145" fill="#4a2d16" opacity="0.6"/>
    <!-- storage tanks -->
    <rect x="60" y="80" width="55" height="65" rx="6" fill="#6b4a1c"/>
    <ellipse cx="87" cy="80" rx="28" ry="8" fill="#7a5a24"/>
    <rect x="130" y="95" width="50" height="50" rx="5" fill="#6b4a1c"/>
    <ellipse cx="155" cy="95" rx="25" ry="7" fill="#7a5a24"/>
    <!-- pipes -->
    <rect x="185" y="140" width="140" height="6" fill="#8a6a2c"/>
    <rect x="200" y="120" width="6" height="80" fill="#8a6a2c"/>
    <!-- flare stack -->
    <rect x="315" y="60" width="8" height="85" fill="#7a5a24"/>
    <rect x="312" y="94" width="14" height="5" fill="#7a5a24"/>
    <circle cx="319" cy="58" r="10" fill="#f6c96a"/>
  </g>

  <!-- horizon ridge -->
  <rect x="0" y="165" width="1600" height="100" fill="#5a3d18"/>

  <!-- Agricultural field on the right -->
  <g clip-path="polygon(0 165,1600 165,1600 265,0 265)">
    <rect x="700" y="165" width="900" height="100" fill="#7a8a2c"/>
    <!-- crop rows -->
    <g stroke="#5f6e22" stroke-width="3" opacity="0.7">
      <path d="M700 180 q30 -6 60 0"/>
      <path d="M760 178 q30 -6 60 0"/>
      <path d="M820 182 q30 -6 60 0"/>
      <path d="M880 178 q30 -6 60 0"/>
      <path d="M940 184 q30 -6 60 0"/>
      <path d="M1000 179 q30 -6 60 0"/>
      <path d="M1060 183 q30 -6 60 0"/>
      <path d="M1120 178 q30 -6 60 0"/>
      <path d="M1180 182 q30 -6 60 0"/>
      <path d="M1240 177 q30 -6 60 0"/>
      <path d="M1300 181 q30 -6 60 0"/>
    </g>
  </g>

  <!-- Tractor in the field -->
  <g transform="translate(1120,205)">
    <rect x="-20" y="0" width="90" height="30" rx="4" fill="#c0392b"/>
    <rect x="-30" y="20" width="40" height="22" rx="3" fill="#2c1a0a"/>
    <circle cx="55" cy="48" r="16" fill="#1b1208" stroke="#8a6a2c" stroke-width="2"/>
    <circle cx="0" cy="50" r="14" fill="#1b1208" stroke="#8a6a2c" stroke-width="2"/>
    <rect x="45" y="-6" width="14" height="22" fill="#c0392b"/>
  </g>

  <!-- Modern building on far right -->
  <g transform="translate(1450,40)">
    <rect x="0" y="0" width="120" height="160" fill="#d7c9a0"/>
    <rect x="0" y="0" width="120" height="160" fill="#c9b98e" opacity="0.4"/>
    <g fill="#e0dcc0">
      <rect x="12" y="12" width="22" height="18"/>
      <rect x="46" y="12" width="22" height="18"/>
      <rect x="80" y="12" width="22" height="18"/>
      <rect x="12" y="44" width="22" height="18"/>
      <rect x="46" y="44" width="22" height="18"/>
      <rect x="80" y="44" width="22" height="18"/>
      <rect x="12" y="76" width="22" height="18"/>
      <rect x="46" y="76" width="22" height="18"/>
      <rect x="80" y="76" width="22" height="18"/>
      <rect x="12" y="108" width="22" height="18"/>
      <rect x="46" y="108" width="22" height="18"/>
      <rect x="80" y="108" width="22" height="18"/>
    </g>
    <g fill="#4a2d16">
      <rect x="52" y="140" width="16" height="20"/>
    </g>
    <rect x="-8" y="160" width="136" height="6" fill="#4a2d16"/>
  </g>

  <!-- Fuel tanker truck in the center -->
  <g transform="translate(600,150)">
    <rect x="0" y="20" width="180" height="55" rx="14" fill="#9aa0a8"/>
    <rect x="0" y="20" width="180" height="20" rx="14" fill="#c2c7cc"/>
    <rect x="8" y="40" width="150" height="6" rx="3" fill="#8a9098"/>
    <rect x="8" y="52" width="150" height="6" rx="3" fill="#8a9098"/>
    <!-- cab -->
    <rect x="-55" y="15" width="60" height="60" rx="6" fill="#b0392b"/>
    <rect x="-52" y="20" width="40" height="28" rx="4" fill="#dce8f0"/>
    <rect x="-50" y="52" width="35" height="16" fill="#2c1a0a"/>
    <!-- wheels -->
    <circle cx="-30" cy="82" r="17" fill="#1b1208" stroke="#7a5a24" stroke-width="3"/>
    <circle cx="40" cy="82" r="17" fill="#1b1208" stroke="#7a5a24" stroke-width="3"/>
    <circle cx="120" cy="82" r="17" fill="#1b1208" stroke="#7a5a24" stroke-width="3"/>
    <circle cx="165" cy="82" r="17" fill="#1b1208" stroke="#7a5a24" stroke-width="3"/>
    <g fill="#c8a04a">
      <rect x="176" y="30" width="3" height="35"/>
    </g>
  </g>

  <!-- Storefront / fuel station pump near center-left -->
  <g transform="translate(430,150)" opacity="0.85">
    <rect x="0" y="40" width="10" height="45" fill="#6b4a1c"/>
    <rect x="0" y="10" width="10" height="20" fill="#6b4a1c"/>
    <rect x="-4" y="30" width="18" height="14" rx="3" fill="#8a6a2c"/>
    <rect x="10" y="30" width="28" height="46" rx="6" fill="#b0392b"/>
    <circle cx="24" cy="48" r="5" fill="#fff3c4"/>
  </g>
</svg>
