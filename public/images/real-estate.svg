<svg width="420" height="300" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1230"/>
      <stop offset="55%" stop-color="#18204a"/>
      <stop offset="100%" stop-color="#2a1a3a"/>
    </linearGradient>
    <radialGradient id="rmoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7e0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="300" fill="url(#rs)"/>

  <!-- moon -->
  <circle cx="330" cy="70" r="45" fill="url(#rmoon)"/>
  <circle cx="330" cy="70" r="22" fill="#fff7e0"/>

  <!-- city skyline backdrop -->
  <g fill="#121a38" opacity="0.9">
    <rect x="0" y="180" width="30" height="60"/>
    <rect x="34" y="160" width="26" height="80"/>
    <rect x="64" y="185" width="24" height="55"/>
  </g>

  <!-- main luxury building -->
  <g transform="translate(140,60)">
    <rect x="0" y="0" width="140" height="190" fill="#d7c9a0"/>
    <rect x="0" y="0" width="140" height="190" fill="#b9a878" opacity="0.35"/>
    <!-- windows pattern -->
    <g fill="#18204a">
      <rect x="14" y="14" width="22" height="26" rx="2"/>
      <rect x="14" y="52" width="22" height="26" rx="2"/>
      <rect x="14" y="90" width="22" height="26" rx="2"/>
      <rect x="14" y="128" width="22" height="26" rx="2"/>
      <rect x="48" y="14" width="22" height="26" rx="2"/>
      <rect x="48" y="52" width="22" height="26" rx="2"/>
      <rect x="48" y="90" width="22" height="26" rx="2"/>
      <rect x="48" y="128" width="22" height="26" rx="2"/>
      <rect x="82" y="14" width="22" height="26" rx="2"/>
      <rect x="82" y="52" width="22" height="26" rx="2"/>
      <rect x="82" y="90" width="22" height="26" rx="2"/>
      <rect x="82" y="128" width="22" height="26" rx="2"/>
    </g>
    <!-- lit windows glow -->
    <g fill="#f6c96a" opacity="0.9">
      <rect x="48" y="14" width="22" height="26" rx="2"/>
      <rect x="82" y="52" width="22" height="26" rx="2"/>
      <rect x="14" y="90" width="22" height="26" rx="2"/>
    </g>
    <!-- entrance -->
    <rect x="70" y="160" width="20" height="30" fill="#2a2115"/>
    <rect x="64" y="250" width="12" height="0"/>
  </g>

  <!-- colonnade/roof -->
  <rect x="140" y="56" width="140" height="8" rx="3" fill="#4a2d16"/>

  <!-- ground curb -->
  <rect x="0" y="250" width="420" height="50" fill="#17140E"/>
  <rect x="0" y="248" width="420" height="5" fill="#6b4a1c"/>

  <!-- foreground palm/shrubs -->
  <g fill="#12351a" opacity="0.95">
    <ellipse cx="60" cy="252" rx="60" ry="20"/>
    <ellipse cx="360" cy="254" rx="70" ry="22"/>
  </g>
  <g stroke="#0c2812" stroke-width="3">
    <path d="M350 255 v-8"/>
    <path d="M360 255 v-10"/>
  </g>
</svg>
