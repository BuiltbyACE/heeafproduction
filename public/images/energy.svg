<svg width="420" height="300" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="esky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="60%" stop-color="#4a2d16"/>
      <stop offset="100%" stop-color="#7a4a1c"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="url(#esky)"/>

  <!-- sunset glow -->
  <circle cx="210" cy="130" r="60" fill="#d98b2b" opacity="0.5"/>
  <circle cx="210" cy="130" r="26" fill="#f6c96a"/>

  <!-- refinery silhouette -->
  <g fill="#1a1208" opacity="0.95">
    <!-- distillation columns -->
    <rect x="40" y="120" width="14" height="110"/>
    <rect x="70" y="100" width="16" height="130"/>
    <rect x="100" y="120" width="14" height="110"/>
    <rect x="130" y="90" width="18" height="140"/>
    <!-- horizontal pipes -->
    <rect x="40" y="160" width="110" height="6"/>
    <rect x="40" y="185" width="110" height="6"/>
    <rect x="40" y="210" width="110" height="6"/>
    <!-- small platforms -->
    <rect x="60" y="140" width="40" height="4"/>
    <rect x="90" y="110" width="40" height="4"/>
  </g>

  <!-- storage tanks -->
  <g fill="#241a10">
    <rect x="180" y="180" width="70" height="70" rx="8"/>
    <ellipse cx="215" cy="180" rx="35" ry="9" fill="#2a2115"/>
    <rect x="190" y="190" width="22" height="40" rx="4"/>
    <rect x="220" y="190" width="22" height="40" rx="4"/>
  </g>

  <!-- flare stack right -->
  <g>
    <rect x="310" y="60" width="8" height="160" fill="#2a2115"/>
    <rect x="308" y="100" width="12" height="5" fill="#2a2115"/>
    <circle cx="314" cy="56" r="14" fill="#f6c96a" opacity="0.9"/>
    <circle cx="314" cy="56" r="22" fill="#f6c96a" opacity="0.3"/>
  </g>

  <!-- ground -->
  <rect x="0" y="240" width="420" height="60" fill="#1a1208"/>
  <rect x="0" y="238" width="420" height="4" fill="#8a9098"/>

  <!-- small pipes near ground -->
  <g fill="#7a5a24">
    <rect x="0" y="252" width="200" height="4"/>
    <rect x="80" y="256" width="4" height="30"/>
  </g>
</svg>
